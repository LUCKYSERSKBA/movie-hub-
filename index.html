<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Hub</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0f0b;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- സെക്യൂരിറ്റി ബ്ലോക്കുകൾ മറികടക്കാൻ അഡ്വാൻസ്ഡ് പ്രോക്സി ലിങ്ക് -->
    <iframe id="cineFrame" src="https://api.allorigins.win/embed?url=https://cinejoy.pk" sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-popups"></iframe>

    <script>
        const iframe = document.getElementById('cineFrame');

        iframe.onload = function() {
            try {
                const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;

                // 1. ഒറിജിനൽ ലോഗോയും ഡിസ്ക്ലെയിമറും ഹൈഡ് ചെയ്യാൻ
                const elementsToHide = iframeDoc.querySelectorAll('img[src*="logo"], .cinejoy-logo, footer, p');
                elementsToHide.forEach(el => {
                    if (el.innerText && (el.innerText.includes('Cinejoy does not host') || el.innerText.includes('cinejoy.pk'))) {
                        el.style.display = 'none';
                    }
                });

                // 2. താഴെയുള്ള ബ്രാൻഡിങ് മാറ്റങ്ങൾ
                const targetArea = iframeDoc.querySelector('body');
                if (targetArea && !iframeDoc.getElementById('myCustomBrand')) {
                    const customDiv = iframeDoc.createElement('div');
                    customDiv.id = 'myCustomBrand';
                    customDiv.style.cssText = 'position:fixed; bottom:70px; width:100%; text-align:center; z-index:99999; pointer-events:auto;';
                    customDiv.innerHTML = `
                        <img src="https://files.catbox.moe/5tnppp.jpg" style="width: 42px; height: 42px; border-radius: 50%; object-fit: cover; margin-bottom: 5px; border: 1.5px solid #4ade80;" alt="Logo">
                        <div style="color: #999; font-size: 11px; font-family: sans-serif; line-height: 1.4;">
                            Movie Hub does not host, store, or distribute any media files.<br>
                            Contact: <a href="mailto:Aadhixd204@gmail.com" style="color: #4ade80; text-decoration: none;">Aadhixd204@gmail.com</a>
                        </div>
                    `;
                    targetArea.appendChild(customDiv);
                }

                // 3. സെറ്റിംഗ്സ് എബൗട്ട് സെക്ഷൻ & ഇൻസ്റ്റാഗ്രാം ഗ്ലാസ് ബോക്സ്
                const settingsCheck = iframeDoc.querySelector('.settings-container, [class*="setting"]');
                if (settingsCheck && !iframeDoc.getElementById('customAboutSection')) {
                    const aboutDiv = iframeDoc.createElement('div');
                    aboutDiv.id = 'customAboutSection';
                    aboutDiv.style.cssText = 'background-color: #121812; padding: 20px; border-radius: 12px; margin: 15px; color: #fff; font-family: sans-serif; text-align: center; border: 1px solid #222;';
                    aboutDiv.innerHTML = `
                        <h3 style="color: #4ade80; margin-bottom: 5px; font-size: 18px;">Movie Hub</h3>
                        <p style="font-size: 12px; color: #888; margin-bottom: 15px;">Version 1.0.0</p>
                        
                        <div style="margin: 15px 0;">
                            <img src="https://files.catbox.moe/q7c33w.jpg" style="width: 75px; height: 75px; border-radius: 50%; object-fit: cover; border: 2px solid #4ade80;" alt="Developer">
                        </div>
                        
                        <p style="font-size: 14px; font-weight: bold; color: #fff; margin: 5px 0;">Developed by Aadhi</p>
                        <p style="font-size: 11px; color: #888; margin-bottom: 15px;"><a href="mailto:Aadhixd204@gmail.com" style="color: #4ade80; text-decoration: none;">Aadhixd204@gmail.com</a></p>
                        
                        <!-- ഇൻസ്റ്റാഗ്രാം ഗ്ലാസ് ബോക്സ് -->
                        <a href="https://www.instagram.com/aadhi.x._______________" target="_blank" style="display: inline-flex; align-items: center; justify-content: center; background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); padding: 8px 16px; border-radius: 30px; text-decoration: none; color: #fff; margin: 10px 0;">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
                            <span style="font-size: 13px; font-weight: 500; color: #fff;">aadhi</span>
                        </a>

                        <hr style="border: 0; border-top: 1px solid #222; margin: 15px 0;">
                        <p style="font-size: 12px; color: #bbb; line-height: 1.4;">
                            Designed to provide a seamless streaming experience for movies and web series in high quality. Enjoy your favorite entertainment in a clean and user-friendly interface.
                        </p>
                        <p style="font-size: 10px; color: #555; margin-top: 15px;">© 2026 Movie Hub. All Rights Reserved.</p>
                    `;
                    settingsCheck.appendChild(aboutDiv);
                }

            } catch (e) {
                console.log("Bypass handled successfully.");
            }
        };
    </script>
</body>
</html>
